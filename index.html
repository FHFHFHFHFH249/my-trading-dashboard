<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Live Crypto & Forex Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #161a25;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            height: 50px;
        }

        .logo {
            font-weight: bold;
            font-size: 18px;
            color: #2962ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            font-size: 12px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }

        .side-panel {
            width: 320px;
            background-color: #131722;
            border-right: 1px solid #2a2e39;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 15px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #787b86;
            border-bottom: 1px solid #2a2e39;
        }

        .pair-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .pair-item {
            display: flex;
            justify-space: space-between;
            justify-content: space-between;
            align-items: center;
            padding: 18px 15px;
            border-bottom: 1px solid #1e222d;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .pair-item:hover {
            background-color: #1e222d;
        }

        .pair-item.active {
            background-color: #2a2e39;
            border-left: 4px solid #2962ff;
        }

        .pair-name {
            font-weight: bold;
            font-size: 15px;
            color: #ffffff;
        }

        .pair-market {
            font-size: 11px;
            color: #787b86;
            display: block;
            margin-top: 4px;
        }

        .pair-meta {
            text-align: right;
        }

        .pair-price {
            font-family: monospace;
            font-weight: bold;
            font-size: 15px;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.1s ease, color 0.1s ease;
        }

        /* Real-time ticking indicator animations */
        .flash-green {
            background-color: rgba(8, 153, 129, 0.3) !important;
            color: #26a69a !important;
        }

        .flash-red {
            background-color: rgba(242, 54, 69, 0.3) !important;
            color: #ef5350 !important;
        }

        .pair-change {
            font-size: 12px;
            margin-top: 4px;
            font-weight: bold;
        }

        .change-up { color: #089981; }
        .change-down { color: #f23645; }

        .chart-container {
            flex: 1;
            background-color: #1c2030;
            position: relative;
            height: 100%; 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📈 NetStation Pro</div>
        <div class="status" id="connection-status">● Market Live</div>
    </header>

    <div class="workspace">
        <aside class="side-panel">
            <div class="panel-header">24/7 Live Crypto Watchlist</div>
            <ul class="pair-list" id="pairList"></ul>
        </aside>

        <main class="chart-container" id="chartWrapper"></main>
    </div>

    <script type="text/javascript">
        // Using high-volume 24/7 assets so you can see the updates immediately right now
        const targetPairs = [
            { display: 'Bitcoin / USD', symbol: 'BINANCE:BTCUSDT', liveFeed: 'btcusdt', price: '0.00', change: '0.00%', up: true },
            { display: 'Ethereum / USD', symbol: 'BINANCE:ETHUSDT', liveFeed: 'ethusdt', price: '0.00', change: '0.00%', up: true },
            { display: 'Solana / USD', symbol: 'BINANCE:SOLUSDT', liveFeed: 'solusdt', price: '0.00', change: '0.00%', up: true },
            { display: 'BNB / USD', symbol: 'BINANCE:BNBUSDT', liveFeed: 'bnbusdt', price: '0.00', change: '0.00%', up: true },
            { display: 'XRP / USD', symbol: 'BINANCE:XRPUSDT', liveFeed: 'xrpusdt', price: '0.00', change: '0.00%', up: true }
        ];

        let activeSymbol = targetPairs[0].symbol;
        let ws;

        function loadChart(symbol) {
            const container = document.getElementById('chartWrapper');
            const formattedSymbol = encodeURIComponent(symbol);
            container.innerHTML = `
                <iframe src="https://tradingview.com{formattedSymbol}&interval=D&theme=dark&style=1&timezone=Etc%2FUTC&locale=en"></iframe>
            `;
        }

        function renderSidebar() {
            const listContainer = document.getElementById('pairList');
            listContainer.innerHTML = '';

            targetPairs.forEach(pair => {
                const li = document.createElement('li');
                li.className = `pair-item ${pair.symbol === activeSymbol ? 'active' : ''}`;
                
                li.innerHTML = `
                    <div>
                        <span class="pair-name">${pair.display}</span>
                        <span class="pair-market">${pair.symbol.split(':')[1]}</span>
                    </div>
                    <div class="pair-meta">
                        <div class="pair-price" id="price-${pair.liveFeed}">--</div>
                        <div class="pair-change" id="change-${pair.liveFeed}">--</div>
                    </div>
                `;

                li.addEventListener('click', () => {
                    activeSymbol = pair.symbol;
                    renderSidebar();
                    loadChart(pair.symbol);
                });

                listContainer.appendChild(li);
            });
        }

        function initLivePriceStream() {
            // Connect to the continuous 24/7 Binance raw ticker WebSockets data pipe
            const streams = targetPairs.map(p => `${p.liveFeed}@ticker`).join('/');
            ws = new WebSocket(`wss://://binance.com{streams}`);

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                const streamName = message.stream.split('@')[0];
                const data = message.data;

                const pair = targetPairs.find(p => p.liveFeed === streamName);
                if (pair) {
                    const priceEl = document.getElementById(`price-${streamName}`);
                    const changeEl = document.getElementById(`change-${streamName}`);
                    
                    const newPrice = parseFloat(data.c);
                    const oldPrice = parseFloat(pair.price);
                    const priceChangePercent = parseFloat(data.P);

                    pair.price = data.c;
                    pair.change = (priceChangePercent >= 0 ? '+' : '') + priceChangePercent.toFixed(2) + '%';
                    pair.up = priceChangePercent >= 0;

                    if (priceEl) {
                        // Keep decimal consistency based on price scaling
                        priceEl.innerText = newPrice > 10 ? newPrice.toFixed(2) : newPrice.toFixed(4);
                        
                        if (oldPrice > 0) {
                            if (newPrice > oldPrice) {
                                priceEl.className = 'pair-price flash-green';
                            } else if (newPrice < oldPrice) {
                                priceEl.className = 'pair-price flash-red';
                            }
                        }
                        
                        setTimeout(() => {
                            priceEl.className = 'pair-price';
                        }, 200);
                    }

                    if (changeEl) {
                        changeEl.innerText = pair.change;
                        changeEl.className = `pair-change ${pair.up ? 'change-up' : 'change-down'}`;
                    }
                }
            };

            ws.onerror = () => {
                document.getElementById('connection-status').innerText = "● Reconnecting Feed";
            };

            ws.onclose = () => {
                setTimeout(initLivePriceStream, 2000);
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            loadChart(activeSymbol);
            initLivePriceStream();
        });
    </script>
</body>
</html>
