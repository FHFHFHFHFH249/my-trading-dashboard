<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetDania Pro - Live Forex Desk</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #161a25;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            height: 50px;
        }

        .logo {
            font-weight: bold;
            font-size: 18px;
            color: #2962ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            font-size: 12px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }

        /* Dedicated Left Side Panel Container */
        .side-panel {
            width: 350px;
            background-color: #131722;
            border-right: 1px solid #2a2e39;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .panel-header {
            padding: 15px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #787b86;
            border-bottom: 1px solid #2a2e39;
            background-color: #131722;
        }

        .watchlist-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* Right Side Main Chart Workspace */
        .chart-container {
            flex: 1;
            background-color: #1c2030;
            height: 100%; 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header Top Navigation -->
    <header>
        <div class="logo">📈 NetStation Pro</div>
        <div class="status">● Market Live</div>
    </header>

    <!-- Main Live Workspace -->
    <div class="workspace">
        
        <!-- Left Side Panel: 100% Reliable Live Streaming Forex Rates -->
        <aside class="side-panel">
            <div class="panel-header">Live Forex Watchlist</div>
            <div class="watchlist-wrapper">
                <iframe src="https://tradingview.com[{%22title%22:%22Forex%22,%22symbols%22:[{%22s%22:%22FX:EURUSD%22,%22d%22:%22EUR/USD%22},{%22s%22:%22FX:GBPUSD%22,%22d%22:%22GBP/USD%22},{%22s%22:%22FX:USDJPY%22,%22d%22:%22USD/JPY%22},{%22s%22:%22FX:AUDUSD%22,%22d%22:%22AUD/USD%22},{%22s%22:%22FX:USDCAD%22,%22d%22:%22USD/CAD%22},{%22s%22:%22FX:USDCHF%22,%22d%22:%22USD/CHF%22}]}]" style="width: 100%; height: 100%;"></iframe>
            </div>
        </aside>

        <!-- Right Side: Native Interactive Main Chart Window -->
        <main class="chart-container">
            <iframe src="https://tradingview.com" style="width: 100%; height: 100%;"></iframe>
        </main>

    </div>

</body>
</html>
