<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Pair Forex Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #161a25;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            height: 50px;
        }

        .logo {
            font-weight: bold;
            font-size: 18px;
            color: #2962ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            font-size: 12px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }

        /* Redesigned Sidebar Container for Live Stream Feeds */
        .side-panel {
            width: 340px;
            background-color: #131722;
            border-right: 1px solid #2a2e39;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel-header {
            padding: 15px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #787b86;
            border-bottom: 1px solid #2a2e39;
        }

        /* Interactive Ticker Row Wrapper */
        .ticker-row-wrapper {
            border-bottom: 1px solid #1e222d;
            cursor: pointer;
            position: relative;
            background-color: #131722;
            transition: background 0.2s ease;
        }

        .ticker-row-wrapper:hover {
            background-color: #1e222d;
        }

        .ticker-row-wrapper.active {
            background-color: #2a2e39;
            border-left: 4px solid #2962ff;
        }

        /* Prevents iframe overlays from blocking clicks */
        .click-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .chart-container {
            flex: 1;
            background-color: #1c2030;
            position: relative;
            height: 100%; 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📈 NetStation Pro</div>
        <div class="status">● Market Live</div>
    </header>

    <div class="workspace">
        <!-- Sidebar containing streaming ticket widgets -->
        <aside class="side-panel" id="sidebarContainer">
            <div class="panel-header">Live Watchlist</div>
            <!-- Populated dynamically via live widget nodes -->
        </aside>

        <main class="chart-container" id="chartWrapper">
            <!-- Dynamic sandboxed presentation frame populates here -->
        </main>
    </div>

    <script type="text/javascript">
        // Curated global financial target streams
        const targetPairs = [
            { name: 'EUR / USD', symbol: 'FX:EURUSD' },
            { name: 'GBP / USD', symbol: 'FX:GBPUSD' },
            { name: 'USD / JPY', symbol: 'FX:USDJPY' },
            { name: 'AUD / USD', symbol: 'FX:AUDUSD' },
            { name: 'USD / CAD', symbol: 'FX:USDCAD' },
            { name: 'Gold / USD', symbol: 'OANDA:XAUUSD' }
        ];

        let activeSymbol = targetPairs[0].symbol;

        // Render main charting window via sandboxed iFrames
        function loadChart(symbol) {
            const container = document.getElementById('chartWrapper');
            const formattedSymbol = encodeURIComponent(symbol);
            
            container.innerHTML = `
                <iframe src="https://tradingview.com{formattedSymbol}&interval=D&symboledit=0&saveimage=1&toolbarbg=161a25&theme=dark&style=1&timezone=Etc%2FUTC&locale=en&utm_source=localhost&utm_medium=widget&utm_campaign=chart"></iframe>
            `;
        }

        // Build native auto-updating ticker elements directly inside the sidebar rows
        function buildStreamingSidebar() {
            const sidebar = document.getElementById('sidebarContainer');
            
            targetPairs.forEach(pair => {
                const wrapper = document.createElement('div');
                wrapper.id = `row-${pair.symbol.replace(':', '-')}`;
                wrapper.className = `ticker-row-wrapper ${pair.symbol === activeSymbol ? 'active' : ''}`;
                
                // Embed custom mini single-ticker streaming frame into row bounds
                const encodedSymbol = encodeURIComponent(pair.symbol);
                wrapper.innerHTML = `
                    <div class="click-shield"></div>
                    <div style="height: 66px; width: 100%; overflow: hidden;">
                        <iframe src="https://tradingview.com{encodedSymbol}&theme=dark&locale=en" style="width:100%; height:126px; margin-top:-20px;"></iframe>
                    </div>
                `;

                // Handle clicking a pair to swap the main chart stream smoothly
                wrapper.addEventListener('click', () => {
                    // Update highlighting properties across rows
                    document.querySelectorAll('.ticker-row-wrapper').forEach(el => el.classList.remove('active'));
                    wrapper.classList.add('active');
                    
                    activeSymbol = pair.symbol;
                    loadChart(pair.symbol);
                });

                sidebar.appendChild(wrapper);
            });
        }

        // Run dashboard construction on document stability
        window.addEventListener('DOMContentLoaded', () => {
            buildStreamingSidebar();
            loadChart(activeSymbol);
        });
    </script>
</body>
</html>
