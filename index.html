<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetDania Pro - Live Forex Desk</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #161a25;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            height: 50px;
        }

        .logo {
            font-weight: bold;
            font-size: 18px;
            color: #2962ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            font-size: 12px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }

        /* Sidebar Layout */
        .side-panel {
            width: 350px;
            background-color: #131722;
            border-right: 1px solid #2a2e39;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .panel-header {
            padding: 15px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #787b86;
            border-bottom: 1px solid #2a2e39;
            background-color: #131722;
        }

        .watchlist-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* Chart Window Area */
        .chart-container {
            flex: 1;
            background-color: #1c2030;
            height: 100%; 
        }
    </style>
    <!-- Core charting script engine loaded in head -->
    <script type="text/javascript" src="https://tradingview.com"></script>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo">📈 NetStation Pro</div>
        <div class="status">● Market Live</div>
    </header>

    <!-- App Main Workspace -->
    <div class="workspace">
        
        <!-- Left Sidebar Panel: Streaming Forex Tickers -->
        <aside class="side-panel">
            <div class="panel-header">Live Forex Watchlist</div>
            <div class="watchlist-wrapper">
                <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://tradingview.com" async>
                    {
                        "colorTheme": "dark",
                        "dateRange": "12M",
                        "showChart": false,
                        "locale": "en",
                        "isTransparent": true,
                        "showSymbolLogo": true,
                        "tabs": [
                            {
                                "title": "Forex",
                                "symbols": [
                                    { "s": "FX:EURUSD", "d": "EUR / USD" },
                                    { "s": "FX:GBPUSD", "d": "GBP / USD" },
                                    { "s": "FX:USDJPY", "d": "USD / JPY" },
                                    { "s": "FX:AUDUSD", "d": "AUD / USD" },
                                    { "s": "FX:USDCAD", "d": "USD / CAD" },
                                    { "s": "FX:USDCHF", "d": "USD / CHF" }
                                ]
                            }
                        ]
                    }
                    </script>
                </div>
            </div>
        </aside>

        <!-- Right Side: Live Candlestick Graph Workspace -->
        <main class="chart-container" id="tv-main-chart"></main>

    </div>

    <!-- Official Widget Initialization Module -->
    <script type="text/javascript">
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof TradingView !== 'undefined') {
                new TradingView.widget({
                    "width": "100%",
                    "height": "100%",
                    "symbol": "FX:EURUSD",
                    "interval": "D",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "en",
                    "enable_publishing": false,
                    "hide_side_toolbar": false,
                    "allow_symbol_change": true,
                    "container_id": "tv-main-chart"
                });
            } else {
                document.getElementById('tv-main-chart').innerHTML = 
                    `<div style="padding:20px; color:#f23645; text-align:center;">TradingView library failing to mount. Please try forcing a browser reload.</div>`;
            }
        });
    </script>
</body>
</html>
