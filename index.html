<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetDania Fullscreen Workspace</title>
    <style>
        /* NetDania Professional Dark Workspace Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Control Header Bar */
        header {
            background-color: #161a25;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            height: 50px;
        }

        .brand {
            font-weight: 800;
            font-size: 16px;
            color: #2962ff;
            letter-spacing: 0.5px;
        }

        .market-badge {
            font-size: 11px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Split-Screen Workspace Layout */
        .workspace-grid {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            width: 100%;
            background-color: #131722;
        }

        /* Left Split: NetDania Style Multi-Column Quote Sheet Container */
        .quote-panel {
            width: 450px;
            height: 100%;
            border-right: 1px solid #2a2e39;
            background-color: #131722;
        }

        /* Right Split: Full Advanced Interactive Candlestick Chart Window */
        .chart-panel {
            flex: 1;
            height: 100%;
            background-color: #1c2030;
        }

        /* Clean full-bleed presentation frames completely safe from domain blocks */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Top Dashboard Header Bar -->
    <header>
        <div class="brand">NETDANIA WORKSPACE PRO</div>
        <div class="market-badge">● Live Forex Active</div>
    </header>

    <!-- Main Workspace Split Grid -->
    <div class="workspace-grid">
        
        <!-- Left Side: Sandboxed Multi-Column Live Forex Market Feed -->
        <section class="quote-panel">
            <iframe src="https://tradingview.com[{%22title%22:%22Forex%22,%22symbols%22:[{%22s%22:%22FX:EURUSD%22,%22d%22:%22EUR/USD%22},{%22s%22:%22FX:GBPUSD%22,%22d%22:%22GBP/USD%22},{%22s%22:%22FX:USDJPY%22,%22d%22:%22USD/JPY%22},{%22s%22:%22FX:AUDUSD%22,%22d%22:%22AUD/USD%22},{%22s%22:%22FX:USDCAD%22,%22d%22:%22USD/CAD%22},{%22s%22:%22FX:USDCHF%22,%22d%22:%22USD/CHF%22}]}]"></iframe>
        </section>

        <!-- Right Side: Advanced Multi-Instrument Interactive Candlestick Chart Engine -->
        <section class="chart-panel">
            <iframe src="https://tradingview.com"></iframe>
        </section>

    </div>

</body>
</html>
