<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetDania Fullscreen Workspace</title>
    <style>
        /* Professional Dark Trading Desk Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Area Control Bar */
        header {
            background-color: #161a25;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            height: 50px;
        }

        .brand {
            font-weight: 800;
            font-size: 16px;
            color: #2962ff;
            letter-spacing: 0.5px;
        }

        .market-badge {
            font-size: 11px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Fullscreen Workspace Splits */
        .fullscreen-desk {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            width: 100%;
            background-color: #131722;
        }

        /* Left Split: NetDania Style Live Multi-Column Quote Stream */
        .quote-list-panel {
            width: 430px;
            height: 100%;
            border-right: 1px solid #2a2e39;
            background-color: #131722;
        }

        /* Right Split: Primary Candlestick Active Chart Screen Window */
        .chart-panel {
            flex: 1;
            height: 100%;
            background-color: #1c2030;
        }

        /* Clean full-bleed presentation frames with no tracking script conflicts */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Top Dashboard Header Bar -->
    <header>
        <div class="brand">NETDANIA WORKSPACE PRO</div>
        <div class="market-badge">● Live Forex Feed</div>
    </header>

    <!-- Main Workspace Application Grid Splitting -->
    <main class="fullscreen-desk">
        
        <!-- Left Side Panel: Direct Frame Multi-Column Streaming Grid -->
        <section class="quote-list-panel">
            <iframe src="https://tradingview.com[{%22title%22:%22Forex%22,%22symbols%22:[{%22s%22:%22FX:EURUSD%22,%22d%22:%22EUR/USD%22},{%22s%22:%22FX:GBPUSD%22,%22d%22:%22GBP/USD%22},{%22s%22:%22FX:USDJPY%22,%22d%22:%22USD/JPY%22},{%22s%22:%22FX:AUDUSD%22,%22d%22:%22AUD/USD%22},{%22s%22:%22FX:USDCAD%22,%22d%22:%22USD/CAD%22},{%22s%22:%22FX:USDCHF%22,%22d%22:%22USD/CHF%22}]}]"></iframe>
        </section>

        <!-- Right Side Panel Area: Direct Advanced Candlestick Chart Window -->
        <section class="chart-panel">
            <iframe src="https://tradingview.com"></iframe>
        </section>

    </main>

</body>
</html>
