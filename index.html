<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetDania Pro - Live Forex Desk</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #161a25;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            height: 50px;
        }

        .logo {
            font-weight: bold;
            font-size: 18px;
            color: #2962ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            font-size: 12px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* Full bleed workspace container matching your workspace dimensions */
        .workspace {
            flex: 1;
            height: calc(100vh - 50px);
            width: 100%;
            background-color: #131722;
        }

        .widget-wrapper-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Header Navigation Bar Controls -->
    <header>
        <div class="logo">📈 NetStation Pro</div>
        <div class="status">● Market Live</div>
    </header>

    <!-- Main Active Workspace Engine -->
    <div class="workspace">
        <div class="widget-wrapper-container">
            <!-- Official Unified Advanced Market Engine Container -->
            <div class="tradingview-widget-container" style="height:100%; width:100%;">
                <div class="tradingview-widget-container__widget" style="height:100%; width:100%;"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                    "autosize": true,
                    "symbol": "FX:EURUSD",
                    "interval": "60",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "en",
                    "enable_publishing": false,
                    "hide_side_toolbar": false,
                    "allow_symbol_change": true,
                    "watchlist": [
                        "FX:EURUSD",
                        "FX:GBPUSD",
                        "FX:USDJPY",
                        "FX:AUDUSD",
                        "FX:USDCAD",
                        "FX:USDCHF"
                    ],
                    "details": true,
                    "hotlist": false,
                    "calendar": false,
                    "show_popup_button": false,
                    "support_host": "https://tradingview.com"
                }
                </script>
            </div>
        </div>
    </div>

</body>
</html>
