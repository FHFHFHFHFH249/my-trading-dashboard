<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Pair Forex Dashboard</title>
    <style>
        /* Modern, dark-themed trading desk UI */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Bar */
        header {
            background-color: #161a25;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            height: 50px;
        }

        .logo {
            font-weight: bold;
            font-size: 18px;
            color: #2962ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            font-size: 12px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* Main Workspace Container */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }

        /* Left Side Panel: Specific Forex Pairs List */
        .side-panel {
            width: 320px;
            background-color: #131722;
            border-right: 1px solid #2a2e39;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 15px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #787b86;
            border-bottom: 1px solid #2a2e39;
        }

        .pair-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .pair-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #1e222d;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .pair-item:hover {
            background-color: #1e222d;
        }

        .pair-item.active {
            background-color: #2a2e39;
            border-left: 4px solid #2962ff;
        }

        .pair-name {
            font-weight: bold;
            font-size: 15px;
        }

        .pair-market {
            font-size: 11px;
            color: #787b86;
            display: block;
            margin-top: 2px;
        }

        /* Simulated price data tokens */
        .pair-meta {
            text-align: right;
        }

        .pair-price {
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
        }

        .change-up { color: #089981; }
        .change-down { color: #f23645; }

        /* Right Side: Main Dynamic Chart Area */
.chart-container {
    flex: 1;
    background-color: #1c2030;
    position: relative;
    height: 100%; /* Force height coverage */
    min-height: 400px; /* Safety fallback threshold */
}


        /* TradingView Frame Wrapper */
        #tradingview_widget {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Header navigation -->
    <header>
        <div class="logo">📈 NetStation Pro</div>
        <div class="status">● Market Live</div>
    </header>

    <!-- Main Workspace Container -->
    <div class="workspace">
        
        <!-- Left Side Panel: List of Specific Pairs -->
        <aside class="side-panel">
            <div class="panel-header">Watchlist Pairs</div>
            <ul class="pair-list" id="pairList">
                <!-- JavaScript populates items dynamically here -->
            </ul>
        </aside>

        <!-- Right Side Frame: Primary Chart Display -->
        <main class="chart-container">
            <div id="tradingview_widget"></div>
        </main>

    </div>

    <!-- Injecting TradingView's Free Advanced Chart Widget Script -->
    <script type="text/javascript" src="https://tradingview.com"></script>
    <script type="text/javascript">
        
        // Define your specific list of pairs to show on the side here
        const targetPairs = [
            { display: 'EUR / USD', symbol: 'FX:EURUSD', price: '1.0842', change: '+0.14%', up: true },
            { display: 'GBP / USD', symbol: 'FX:GBPUSD', price: '1.2635', change: '-0.08%', up: false },
            { display: 'USD / JPY', symbol: 'FX:USDJPY', price: '151.22', change: '+0.32%', up: true },
            { display: 'AUD / USD', symbol: 'FX:AUDUSD', price: '0.6514', change: '-0.21%', up: false },
            { display: 'USD / CAD', symbol: 'FX:USDCAD', price: '1.3568', change: '+0.05%', up: true },
            { display: 'Gold / USD', symbol: 'OANDA:XAUUSD', price: '2178.40', change: '+1.12%', up: true }
        ];

        let activeSymbol = targetPairs[0].symbol;

        // Function to build and update the Charting Engine
        function loadChart(symbol) {
            new TradingView.widget({
                "width": "100%",
                "height": "100%",
                "symbol": symbol,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1", // Candlesticks
                "locale": "en",
                "enable_publishing": false,
                "allow_symbol_change": false,
                "container_id": "tradingview_widget"
            });
        }

        // Render the UI list inside the side-panel
        function renderSidebar() {
            const listContainer = document.getElementById('pairList');
            listContainer.innerHTML = '';

            targetPairs.forEach(pair => {
                const li = document.createElement('li');
                li.className = `pair-item ${pair.symbol === activeSymbol ? 'active' : ''}`;
                
                li.innerHTML = `
                    <div>
                        <span class="pair-name">${pair.display}</span>
                        <span class="pair-market">${pair.symbol.split(':')[0]}</span>
                    </div>
                    <div class="pair-meta">
                        <div class="pair-price">${pair.price}</div>
                        <div class="pair-price ${pair.up ? 'change-up' : 'change-down'}">${pair.change}</div>
                    </div>
                `;

                // Add interactive click listener to swap charts cleanly
                li.addEventListener('click', () => {
                    activeSymbol = pair.symbol;
                    renderSidebar();
                    loadChart(pair.symbol);
                });

                listContainer.appendChild(li);
            });
        }

        // Safer Initialization Routine
window.addEventListener('DOMContentLoaded', () => {
    // Render the initial UI list
    renderSidebar();
    
    // Explicitly fallback to the first symbol if activeSymbol is not set
    const initialSymbol = activeSymbol || targetPairs[0].symbol;
    
    // Tiny 100ms delay ensures the DOM wrapper is 100% stable before embedding
    setTimeout(() => {
        loadChart(initialSymbol);
    }, 100);
});
    </script>
</body>
</html>
