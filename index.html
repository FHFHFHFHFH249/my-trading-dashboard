<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetDania Pro - Multi-Chart Forex Desk</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #161a25;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            height: 50px;
        }

        .logo {
            font-weight: bold;
            font-size: 18px;
            color: #2962ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            font-size: 12px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            background-color: #131722;
        }

        /* 100% stable full-bleed tracking container */
        .widget-wrapper {
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Top Dashboard Header -->
    <header>
        <div class="logo">📈 NetStation Pro</div>
        <div class="status">● Market Live</div>
    </header>

    <!-- Main Workspace Container -->
    <div class="workspace">
        <div class="widget-wrapper">
            <!-- Official Unified TradingView Multi-Chart Widget Frame -->
            <div class="tradingview-widget-container" style="height:100%; width:100%;">
                <div class="tradingview-widget-container__widget" style="height:100%; width:100%;"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                    "colorTheme": "dark",
                    "dateRange": "12M",
                    "showChart": true,
                    "locale": "en",
                    "largeChartUrl": "",
                    "isTransparent": false,
                    "showSymbolLogo": true,
                    "showFloatingTooltip": false,
                    "width": "100%",
                    "height": "100%",
                    "tabs": [
                        {
                            "title": "Forex Live Desk",
                            "symbols": [
                                { "s": "FX:EURUSD", "d": "EUR / USD" },
                                { "s": "FX:GBPUSD", "d": "GBP / USD" },
                                { "s": "FX:USDJPY", "d": "USD / JPY" },
                                { "s": "FX:AUDUSD", "d": "AUD / USD" },
                                { "s": "FX:USDCAD", "d": "USD / CAD" },
                                { "s": "FX:USDCHF", "d": "USD / CHF" }
                            ],
                            "originalTitle": "Forex"
                        }
                    ]
                }
                </script>
            </div>
        </div>
    </div>

</body>
</html>
