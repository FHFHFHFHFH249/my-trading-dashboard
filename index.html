<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetDania Fullscreen Workspace</title>
    <style>
        /* NetDania Professional Dark Desk Theme Style Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Area Control Bar */
        header {
            background-color: #161a25;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            height: 50px;
        }

        .brand {
            font-weight: 800;
            font-size: 16px;
            color: #2962ff;
            letter-spacing: 0.5px;
        }

        .market-badge {
            font-size: 11px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Fullscreen Workspace Grid System Splits */
        .fullscreen-desk {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            width: 100%;
            background-color: #131722;
        }

        /* Left Split: NetDania Style Live Multi-Column Quote Stream */
        .quote-list-panel {
            width: 400px;
            height: 100%;
            border-right: 1px solid #2a2e39;
            background-color: #131722;
            overflow: hidden;
        }

        /* Right Split: Primary Candlestick Active Chart Screen Window */
        .chart-panel {
            flex: 1;
            height: 100%;
            background-color: #1c2030;
        }

        /* Responsive Layout Container Boxes */
        .widget-box {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Top Dashboard Control Header Navigation -->
    <header>
        <div class="brand">NETDANIA WORKSPACE PRO</div>
        <div class="market-badge">● Live Forex Feed</div>
    </header>

    <!-- Main Workspace Application Grid Splitting -->
    <main class="fullscreen-desk">
        
        <!-- Left Column Side Panel: Real-Time Multi-Column Streaming Grid -->
        <section class="quote-list-panel">
            <div class="widget-box">
                <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
                    <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
                    <script type="text/javascript" src="https://tradingview.com" async>
                    {
                        "colorTheme": "dark",
                        "dateRange": "12M",
                        "showChart": false,
                        "locale": "en",
                        "width": "100%",
                        "height": "100%",
                        "isTransparent": true,
                        "showSymbolLogo": true,
                        "tabs": [
                            {
                                "title": "Forex",
                                "symbols": [
                                    { "s": "FX:EURUSD", "d": "EUR / USD" },
                                    { "s": "FX:GBPUSD", "d": "GBP / USD" },
                                    { "s": "FX:USDJPY", "d": "USD / JPY" },
                                    { "s": "FX:AUDUSD", "d": "AUD / USD" },
                                    { "s": "FX:USDCAD", "d": "USD / CAD" },
                                    { "s": "FX:USDCHF", "d": "USD / CHF" },
                                    { "s": "FX:EURGBP", "d": "EUR / GBP" },
                                    { "s": "FX:GBPJPY", "d": "GBP / JPY" }
                                ]
                            }
                        ]
                    }
                    </script>
                </div>
            </div>
        </section>

        <!-- Right Column Panel Area: Advanced Candlestick Chart Module -->
        <section class="chart-panel">
            <div class="widget-box">
                <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
                    <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
                    <script type="text/javascript" src="https://tradingview.com" async>
                    {
                        "autosize": true,
                        "symbol": "FX:EURUSD",
                        "interval": "60",
                        "timezone": "Etc/UTC",
                        "theme": "dark",
                        "style": "1",
                        "locale": "en",
                        "enable_publishing": false,
                        "hide_side_toolbar": false,
                        "allow_symbol_change": true,
                        "calendar": false,
                        "support_host": "https://www.tradingview.com"
                    }
                    </script>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
