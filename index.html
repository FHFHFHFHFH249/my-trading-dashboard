<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetDania Pro - Live Forex Desk</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #161a25;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            height: 50px;
        }

        .logo {
            font-weight: bold;
            font-size: 18px;
            color: #2962ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            font-size: 12px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }

        /* Sidebar container engineered to host live-feed nodes */
        .side-panel {
            width: 350px;
            background-color: #131722;
            border-right: 1px solid #2a2e39;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 15px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #787b86;
            border-bottom: 1px solid #2a2e39;
        }

        /* Container for the real-time sidebar widget */
        .watchlist-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .chart-container {
            flex: 1;
            background-color: #1c2030;
            position: relative;
            height: 100%; 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📈 NetStation Pro</div>
        <div class="status">● Market Live</div>
    </header>

    <div class="workspace">
        <!-- Sidebar containing streaming live prices -->
        <aside class="side-panel">
            <div class="panel-header">Live Forex Watchlist</div>
            <div class="watchlist-wrapper">
                <!-- Official TradingView Market Watchlist Widget -->
                <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
                    <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
                    <script type="text/javascript" src="https://tradingview.com" async>
                    {
                        "colorTheme": "dark",
                        "dateRange": "12M",
                        "showChart": false,
                        "locale": "en",
                        "largeChartUrl": "",
                        "isTransparent": true,
                        "showSymbolLogo": true,
                        "showFloatingTooltip": false,
                        "tabs": [
                            {
                                "title": "Forex",
                                "symbols": [
                                    { "s": "FX:EURUSD", "d": "EUR / USD" },
                                    { "s": "FX:GBPUSD", "d": "GBP / USD" },
                                    { "s": "FX:USDJPY", "d": "USD / JPY" },
                                    { "s": "FX:AUDUSD", "d": "AUD / USD" },
                                    { "s": "FX:USDCAD", "d": "USD / CAD" },
                                    { "s": "FX:USDCHF", "d": "USD / CHF" }
                                ],
                                "originalTitle": "Forex"
                            }
                        ]
                    }
                    </script>
                </div>
            </div>
        </aside>

        <!-- Main Chart Display window linking the system together -->
        <main class="chart-container" id="chartWrapper">
            <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
                <div id="tradingview_main_chart" style="height: 100%; width: 100%;"></div>
                <script type="text/javascript" src="https://tradingview.com"></script>
                <script type="text/javascript">
                    new TradingView.widget({
                        "width": "100%",
                        "height": "100%",
                        "symbol": "FX:EURUSD",
                        "interval": "D",
                        "timezone": "Etc/UTC",
                        "theme": "dark",
                        "style": "1",
                        "locale": "en",
                        "enable_publishing": false,
                        "hide_side_toolbar": false,
                        "allow_symbol_change": true,
                        "container_id": "tradingview_main_chart"
                    });
                </script>
            </div>
        </main>
    </div>

</body>
</html>
