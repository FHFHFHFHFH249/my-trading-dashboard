<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetDania Fullscreen Workspace</title>
    <style>
        /* Professional Dark Trading Desk Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Control Bar */
        header {
            background-color: #161a25;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            height: 50px;
        }

        .brand {
            font-weight: 800;
            font-size: 16px;
            color: #2962ff;
            letter-spacing: 0.5px;
        }

        .market-badge {
            font-size: 11px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Fullscreen Layout Workspace Split Grid */
        .fullscreen-desk {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            width: 100%;
            background-color: #131722;
        }

        /* Left Side: Advanced Quote List Matrix Container */
        .quote-list-panel {
            width: 400px;
            height: 100%;
            border-right: 1px solid #2a2e39;
            background-color: #131722;
        }

        /* Right Side: Primary Active Chart Screen */
        .chart-panel {
            flex: 1;
            height: 100%;
            background-color: #1c2030;
        }
    </style>
    <!-- Load the official TradingView core initialization library securely -->
    <script type="text/javascript" src="https://tradingview.com"></script>
</head>
<body>

    <!-- Top Navigation Header -->
    <header>
        <div class="brand">NETDANIA WORKSPACE PRO</div>
        <div class="market-badge">● Live Data Active</div>
    </header>

    <!-- Fullscreen Trading Workspace Layout Split -->
    <main class="fullscreen-desk">
        
        <!-- Left Side: NetDania Style Multi-Column Live Quote Sheet -->
        <section class="quote-list-panel" id="tv-quote-sidebar"></section>

        <!-- Right Side: Advanced Candlestick Chart Display Framework -->
        <section class="chart-panel" id="tv-main-chart-window"></section>

    </main>

    <!-- Unified Initialization Module Framework -->
    <script type="text/javascript">
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof TradingView !== 'undefined') {
                
                // 1. Safely initialize the Live Streaming Multi-Column Overview Panel via verified script call
                new TradingView.widget({
                    "container_id": "tv-quote-sidebar",
                    "width": "100%",
                    "height": "100%",
                    "symbol": "FX:EURUSD",
                    "interval": "D",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "en",
                    "enable_publishing": false,
                    "hide_legend": true,
                    "hide_side_toolbar": true,
                    "watchlist": [
                        "FX:EURUSD",
                        "FX:GBPUSD",
                        "FX:USDJPY",
                        "FX:AUDUSD",
                        "FX:USDCAD",
                        "FX:USDCHF"
                    ]
                });

                // 2. Mount the Main Interactive Candlestick Tracking Chart Panel Right Next To It
                new TradingView.widget({
                    "container_id": "tv-main-chart-window",
                    "width": "100%",
                    "height": "100%",
                    "symbol": "FX:EURUSD",
                    "interval": "60",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "en",
                    "enable_publishing": false,
                    "hide_side_toolbar": false,
                    "allow_symbol_change": true,
                    "calendar": false
                });

            } else {
                document.body.innerHTML = `<div style="padding: 50px; color: #f23645; text-align: center; font-family: sans-serif;">
                    <h2>Workspace Core Engine Failed to Load</h2>
                    <p style="margin-top: 10px; color: #787b86;">Ensure you have an active network connection and try reloading the page.</p>
                </div>`;
            }
        });
    </script>

</body>
</html>
